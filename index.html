<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Last Call: Premium</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
  <div class="backdrop"></div><div class="vignette"></div>
  <header class="topbar glass-panel"><div><span class="eyebrow">NIGHT <b id="night">1</b></span><strong id="clock">23:45</strong></div><div class="rep"><span>BAR REPUTATION</span><div class="meter"><i id="repFill"></i></div></div><div class="cash">€ <span id="cash">260</span></div></header>

  <main>
    <section class="left-col">
      <article class="glass-panel goal"><span>TAGESZIEL</span><b id="goalText">Verdiene € 400</b><small id="goalProgress">€ 0 / € 400</small></article>
      <article class="glass-panel guest-card"><h2 id="guestName">Valencia</h2><p id="guestRole">Cybernetische Agentin</p><div class="heartrow">♥ <div class="meter"><i id="heartFill"></i></div><span id="heartValue">35/100</span></div><h3>MAG</h3><p id="likes">Starke Drinks, Ehrlichkeit, Nachtstadt</p><h3 class="bad">MAG NICHT</h3><p id="dislikes">Lügen, billige Ausreden</p></article>
    </section>

    <section class="stage">
      <div class="portrait-shell"><div id="portrait" class="portrait"></div><div class="scan"></div></div>
      <div class="dialog glass-panel"><span id="speaker">Valencia</span><p id="dialogText">Die Nacht ist jung. Überrasche mich mit etwas Starkem.</p></div>
      <div id="choices" class="choices"></div>
    </section>

    <aside class="recipe glass-panel">
      <div class="recipe-head"><div><span>RECIPE BOOK</span><h2 id="recipeName">Neon Reaper</h2></div><button id="nextRecipe">›</button></div>
      <canvas id="recipeGlass" width="240" height="180"></canvas>
      <div id="recipeLines" class="recipe-lines"></div>
      <small id="recipeIce">Crushed Ice</small>
    </aside>

    <section class="barstation glass-panel">
      <div class="icebox"><button data-ice="cubes">◇ Eiswürfel</button><button data-ice="crushed">✦ Crushed Ice</button><button data-ice="none">○ Ohne Eis</button></div>
      <div class="mix-center">
        <div class="shaker-wrap"><div id="shaker" class="shaker"><div class="shaker-liquid"></div></div><button id="shakeBtn">SHAKEN</button></div>
        <div id="bottles" class="bottles"></div>
        <div class="glass-wrap"><canvas id="drinkCanvas" width="220" height="240"></canvas><button id="serveBtn">🍸 SERVIEREN</button></div>
      </div>
      <div class="controls"><button data-step="-25">−25</button><button data-step="-10">−10</button><button data-step="-5">−5</button><button id="pourBtn" class="pour">EINSCHENKEN</button><button data-step="5">+5</button><button data-step="10">+10</button><button data-step="25">+25</button></div>
    </section>
  </main>

  <nav class="bottomnav"><button class="active">BAR</button><button id="shopBtn">SHOP</button><button id="contactsBtn">KONTAKTE</button><button id="missionsBtn">MISSIONEN</button></nav>
  <div id="toast"></div>
  <dialog id="modal"><button id="closeModal">×</button><div id="modalBody"></div></dialog>
</div><script src="game.js"></script></body></html>
