<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
<defs>
  <linearGradient id="skin" x1=".2" y1="0" x2=".8" y2="1">
    <stop stop-color="#f6c8b4"/><stop offset=".48" stop-color="#d9958f"/><stop offset="1" stop-color="#965c70"/>
  </linearGradient>
  <radialGradient id="faceLight" cx=".35" cy=".28" r=".85">
    <stop stop-color="#ffe2d2" stop-opacity=".72"/><stop offset=".62" stop-color="#f4b6ab" stop-opacity=".06"/><stop offset="1" stop-color="#733c65" stop-opacity=".42"/>
  </radialGradient>
  <linearGradient id="hair" x1=".05" y1=".05" x2=".95" y2=".9">
    <stop stop-color="#20203d"/><stop offset=".32" stop-color="#312351"/><stop offset=".66" stop-color="#722c87"/><stop offset="1" stop-color="#17182d"/>
  </linearGradient>
  <linearGradient id="hairGlow" x1="0" x2="1">
    <stop stop-color="#55e7ff"/><stop offset=".48" stop-color="#b55cff"/><stop offset="1" stop-color="#ff4da8"/>
  </linearGradient>
  <linearGradient id="jacket" x1="0" x2="1" y2="1">
    <stop stop-color="#25334e"/><stop offset=".42" stop-color="#121827"/><stop offset=".78" stop-color="#251635"/><stop offset="1" stop-color="#090d18"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" x2="1">
    <stop stop-color="#bdefff"/><stop offset=".22" stop-color="#46748d"/><stop offset=".55" stop-color="#17233a"/><stop offset=".8" stop-color="#8f4d8e"/><stop offset="1" stop-color="#f1a5d5"/>
  </linearGradient>
  <filter id="cyanGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="pinkGlow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02030b" flood-opacity=".82"/></filter>
  <clipPath id="faceClip"><path d="M282 236Q350 170 445 201Q518 228 531 327L514 501Q497 595 405 635Q313 603 282 514Q261 401 282 236Z"/></clipPath>
</defs>

