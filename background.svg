<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#060817"/><stop offset=".52" stop-color="#101229"/><stop offset="1" stop-color="#03040c"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#190e1d"/><stop offset=".45" stop-color="#4d1731"/><stop offset="1" stop-color="#101425"/></linearGradient>
  <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8d3444"/><stop offset=".15" stop-color="#341423"/><stop offset="1" stop-color="#0b0a13"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="25"/></filter>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#67325e" stroke-opacity=".14" stroke-width="2"/></pattern>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#grid)"/>
